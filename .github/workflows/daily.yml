name: Daily Publisher Monitor
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture public publisher pages
        env:
          US_PROXY_SERVER: ${{ secrets.US_PROXY_SERVER }}
          US_PROXY_USERNAME: ${{ secrets.US_PROXY_USERNAME }}
          US_PROXY_PASSWORD: ${{ secrets.US_PROXY_PASSWORD }}
        run: |
          npm run capture
          node scripts/capture-official.mjs
      - name: Check snapshot integrity
        run: npm run verify
      - name: Save dated evidence
        run: |
          git config user.name "publisher-pulse[bot]"
          git config user.email "publisher-pulse[bot]@users.noreply.github.com"
          git add dist/data dist/captures
          if ! git diff --cached --quiet; then
            git commit -m "Daily public publisher snapshot"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: capture
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy daily snapshot
        id: deployment
        uses: actions/deploy-pages@v4
